name: Phase2 Materialize Direct Source
on:
  push:
    branches: [phase2-direct-social-fix]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-direct-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-direct-social-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize existing effective source once
        run: npm run social-policy
      - name: Apply direct-source Phase 2 repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          p.write_text(p.read_text(), encoding='utf-8', newline='\n')
          PY
          cat .phase2-migration/patch.* > /tmp/phase2-direct.patch
          git apply --check /tmp/phase2-direct.patch
          git apply /tmp/phase2-direct.patch
      - name: Verify exact invariants
        shell: bash
        run: |
          node --check server/proxy.js
          grep -q 'A POSZT, AMIRE REAGÁLSZ:' src/App.jsx
          grep -q 'reagal_erre' src/App.jsx
          grep -q 'groundedRegisterPlayerPostInvitation' src/App.jsx
          grep -q 'player-post-world' src/App.jsx
          grep -q 'follow-not-returned' src/App.jsx
          grep -q 'AI_PROMPT_DEBUG' server/proxy.js
          grep -q 'apply-patches=disabled' package.json
          if grep -q 'node scripts/apply-grounded-events-invites-v1.mjs' package.json; then echo 'ERROR: patch chain still active' >&2; exit 1; fi
      - name: Install and build canonical source
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit canonical source and remove migration tooling
        shell: bash
        run: |
          rm -rf .phase2-migration
          rm -f .github/workflows/phase2-source-export.yml
          rm -f .github/workflows/phase2-materialize-direct.yml
          git add -A
          git config user.name 'phase2-direct-source'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Phase 2 direct social event repair [phase2-direct-done]'
          git push origin HEAD:phase2-direct-social-fix
