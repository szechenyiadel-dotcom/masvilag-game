name: Phase2 Direct Source Repair
on:
  push:
    branches: [phase2-direct-social-fix]
permissions:
  contents: write
jobs:
  repair-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply existing chain once
        run: |
          if ! grep -q 'A POSZT, AMIRE REAGÁLSZ:' src/App.jsx; then
            npm run social-policy
          fi
      - name: Migrate to canonical direct source
        run: python tools/phase2_direct_source_migration.py
      - name: Validate server syntax
        run: node --check server/proxy.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit canonical direct source
        run: |
          git config user.name 'phase2-direct-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.jsx server/proxy.js package.json
          if git diff --cached --quiet; then
            echo '[phase2] no source changes to commit'
          else
            git commit -m 'Canonicalize social runtime and fix Phase 2 flow'
            git push origin HEAD:phase2-direct-social-fix
          fi
