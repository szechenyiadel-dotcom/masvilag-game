name: Phase2 Source Export
on:
  push:
    branches: [phase2-direct-social-fix]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact repository source
        uses: actions/upload-artifact@v4
        with:
          name: phase2-repo
          path: |
            .
            !.git/**
          if-no-files-found: error
