name: Export Current Main Phase2 Files
on:
  push:
    branches: [phase2-direct-social-fix]
permissions:
  contents: read
jobs:
  export-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify current main invariants
        run: |
          grep -q 'A POSZT, AMIRE REAGÁLSZ:' src/App.jsx
          grep -q 'reagal_erre' src/App.jsx
          grep -q 'groundedRegisterPlayerPostInvitation' src/App.jsx
          grep -q 'player-post-world' src/App.jsx
          grep -q 'follow-not-returned' src/App.jsx
          grep -q 'AI_PROMPT_DEBUG' server/proxy.js
          grep -q 'apply-patches=disabled' package.json
          node --check server/proxy.js
      - name: Archive full ready files
        uses: actions/upload-artifact@v4
        with:
          name: masvilag-phase2-ready-files
          path: |
            src/App.jsx
            server/proxy.js
            package.json
          if-no-files-found: error
