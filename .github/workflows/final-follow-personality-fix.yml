name: Final Follow Personality Fix
on:
  push:
    branches: [phase2-direct-social-fix]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch canonical App.jsx directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()
          old='''  for (const row of rows) {\n    if (!charById(w, row.botId) || isHuman(w, row.botId)) { delete state.pendingFollowBack[row.botId]; continue; }\n    const pauseReason = typeof eventDrivenAutonomousDmPauseReason === "function" ? String(eventDrivenAutonomousDmPauseReason(w) || "") : "";'''
          new='''  for (const row of rows) {\n    if (!charById(w, row.botId) || isHuman(w, row.botId)) { delete state.pendingFollowBack[row.botId]; continue; }\n    if (!groundedFollowBackPersonalityEligible(w, row.botId, row.humanId)) {\n      groundedEventLog(w, "follow-not-returned", "failed", "No follow-back DM: character personality/relationship does not justify a direct reaction.", "follow:" + row.botId + ">" + row.humanId);\n      delete state.pendingFollowBack[row.botId];\n      continue;\n    }\n    const pauseReason = typeof eventDrivenAutonomousDmPauseReason === "function" ? String(eventDrivenAutonomousDmPauseReason(w) || "") : "";'''
          if old not in s:
              raise SystemExit('ERROR: canonical follow scheduler target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify and build
        shell: bash
        run: |
          grep -q 'No follow-back DM: character personality/relationship' src/App.jsx
          npm install --no-audit --no-fund
          npm run build
      - name: Commit only App.jsx
        shell: bash
        run: |
          git add src/App.jsx
          git config user.name 'phase2-direct-source'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Gate follow-back DM by character personality'
          git push origin HEAD:main
