name: Export Final Phase2 Files
on:
  push:
    branches: [phase2-direct-social-fix]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-artifact@v4
        with:
          name: masvilag-phase2-final
          path: |
            src/App.jsx
            server/proxy.js
            package.json
          if-no-files-found: error
